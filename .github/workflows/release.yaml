# Release. Triggered by pushing a `vX.Y.Z` tag.
#
# The tagged commit is what consumers execute, so it is re-verified from scratch
# before anything is published: a tag pointing at a stale dist/index.js or at
# metadata the Marketplace rejects would ship broken. Once it passes, the GitHub
# Release is created and the floating major tag (`v1`) is moved forward.
#
# Publishing the release to the Marketplace itself is a one-time manual step,
# described in CONTRIBUTING.md — the API cannot tick that checkbox.
name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tagged commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check the tag matches package.json
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(bun --print 'require("./package.json").version')"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $pkg."
            exit 1
          fi

      - name: Check action.yml is publishable
        run: bun run check:metadata

      - name: Lint (biome)
        run: bun run lint

      - name: Typecheck (tsc)
        run: bun run typecheck

      - name: Test (bun test)
        run: bun test

      - name: Build bundle
        run: bun run build

      - name: Verify dist/ matches the tagged source
        run: |
          if [ -n "$(git status --porcelain dist)" ]; then
            echo "::error::dist/ at $GITHUB_REF_NAME is stale. Rebuild, commit, and re-tag."
            git --no-pager diff -- dist
            exit 1
          fi

  release:
    name: Publish the GitHub Release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      # Required to create the release and to move the major alias tag.
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; leaving it untouched."
            exit 0
          fi
          # A tag containing a hyphen after the patch number is a prerelease
          # (for example v1.1.0-rc.1) and is kept out of "Latest".
          prerelease=""
          case "$tag" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$tag" \
            --title "$tag" \
            --generate-notes \
            --verify-tag \
            $prerelease

      - name: Move the major version tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          # Prereleases must not move the alias that stable consumers track.
          case "$tag" in
            *-*) echo "$tag is a prerelease; leaving the major tag in place."; exit 0 ;;
          esac
          major="${tag%%.*}"
          git tag --force "$major" "$GITHUB_SHA"
          git push --force origin "refs/tags/$major"
          echo "Moved $major to $GITHUB_SHA."
